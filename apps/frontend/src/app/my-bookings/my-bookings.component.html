<div class="page-shell">
  <header>
    <p class="text-eyebrow">Your account</p>
    <h1 class="page-title text-display">My bookings</h1>
  </header>

  @if (rideDays().length === 0) {
    <app-empty-state
      body="Nothing booked yet. Pick a ride from the schedule and your spot shows up here straight away."
      headline="No rides booked"
      icon="pi-calendar-times"
    />
  } @else {
    <div class="bookings__tabs">
      <app-ride-day-tabs
        [days]="rideDays()"
        [selectedDateKey]="selectedDateKey()"
        (daySelected)="selectDay($event)"
      />
    </div>

    @for (day of rideDays(); track day.dateKey) {
      @if (day.dateKey === selectedDateKey()) {
        <section>
          <h2 class="day-heading">{{ day.date | date: 'fullDate' }}</h2>

          @for (session of day.sessions; track session.id) {
            <app-ride-row [isBookedByUser]="true" [session]="session" (cancelRequested)="cancelBooking($event)" />
          }
        </section>
      }
    }
  }
</div>
