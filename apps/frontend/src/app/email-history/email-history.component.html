<div class="page-shell">
  <header>
    <p class="text-eyebrow">Development only</p>
    <h1 class="page-title text-display">Email history</h1>
    <p class="page-lede">Every transactional email this environment has sent, kept for local inspection.</p>
  </header>

  @if (emails()?.length === 0) {
    <app-empty-state
      body="Password change and reset notifications will show up here once they are sent."
      headline="No emails sent"
      icon="pi-envelope"
    />
  } @else {
    <div class="emails__toolbar">
      <p-button
        icon="pi pi-trash"
        label="Delete all"
        severity="danger"
        [loading]="deleting()"
        (onClick)="deleteAllEmails()"
      />
    </div>

    @for (email of emails(); track email.sentAt) {
      <button class="emailrow" type="button" (click)="viewEmailContent(email)">
        <span class="emailrow__head">
          <span class="emailrow__subject">{{ email.subject }}</span>
          <span class="emailrow__date text-numeric">{{ email.sentAt | date: 'medium' }}</span>
        </span>
        <span class="emailrow__to">{{ email.to }}</span>
        <span class="emailrow__preview">{{ email.textContent.substring(0, 140) }}…</span>
      </button>
    }
  }
</div>

<p-dialog
  contentStyleClass="max-h-[70vh] overflow-y-auto"
  styleClass="w-11/12 md:w-3/4 lg:w-2/3"
  [closable]="true"
  [draggable]="false"
  [focusOnShow]="false"
  [modal]="true"
  [resizable]="false"
  [(visible)]="showEmailDialog"
>
  <ng-template pTemplate="header">
    <h2 class="text-lg font-semibold">{{ selectedEmail()?.subject }}</h2>
  </ng-template>
  <div [innerHTML]="sanitizedEmailContent()"></div>
</p-dialog>
