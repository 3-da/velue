services:
  # PostgreSQL 17 Database
  postgres:
    image: postgres:17
    container_name: velocity-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: velocity_db
      POSTGRES_USER: velocity_user
      POSTGRES_PASSWORD: velocity_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - velocity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity_user -d velocity_db"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  velocity-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    # Pinned so the volume survives a rename of the checkout directory.
    # Compose otherwise derives the name from the folder and would silently
    # create an empty one.
    name: velocity_postgres_data
